name: Build Notifica (Rootless and Roothide)

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify-and-build:
    name: ${{ matrix.display_name }}
    # Xcode on macOS emits the iOS 14+ arm64e ABI required by the iOS 15
    # Preferences process on A12-and-later hardware.
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: rootless
            display_name: Build standard rootless package
            artifact_name: Notifica-rootless-iOS15-17
          - scheme: roothide
            display_name: Build Roothide hidden-root package
            artifact_name: Notifica-Roothide-iOS15-17
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: ${{ matrix.scheme }}
      FINALPACKAGE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run static compatibility checks
        run: python3 tests/verify_maintenance_release.py

      - name: Confirm Xcode arm64e toolchain
        shell: bash
        run: |
          set -euxo pipefail
          xcodebuild -version
          xcode-select -p
          xcrun --sdk iphoneos --find clang

      - name: Install RootHide Theos and pinned iPhoneOS SDK
        shell: bash
        run: |
          set -euxo pipefail
          brew install ldid xz
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "${THEOS}"
          mkdir -p "${THEOS}/sdks"
          curl -fsSL https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz \
            | tar -xJ -C "${THEOS}/sdks"
          test -f "${THEOS}/sdks/iPhoneOS16.5.sdk/System/Library/PrivateFrameworks/MediaRemote.framework/MediaRemote.tbd"

      - name: Install Cephei SDK headers and libraries
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL -o /tmp/cephei_sdk.zip \
            https://github.com/hbang/libcephei/releases/download/2.0/cephei_sdk_2.0.zip
          unzip -q /tmp/cephei_sdk.zip -d /tmp
          cp -R /tmp/cephei_sdk_2.0/*.framework "${THEOS}/vendor/lib/iphone/rootless/"
          cp -R /tmp/cephei_sdk_2.0/*.framework "${THEOS}/vendor/lib/iphone/roothide/"

      - name: Build selected package with Xcode arm64e ABI
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${THEOS}/sdks/iPhoneOS16.5.sdk"
          THEOS="${THEOS}" TARGET=iphone:clang:16.5:15.0 SYSROOT="${SDK_ROOT}" ISYSROOT="${SDK_ROOT}" \
            make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=${{ matrix.scheme }}

      - name: Verify emitted DEB
        shell: bash
        run: bash tests/verify_package_layout.sh packages

      - name: Reject old arm64e ABI toolchain output
        shell: bash
        run: |
          set -euxo pipefail
          ! grep -RinE 'incompatible arm64e ABI|error:' .theos packages

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: packages/*.deb
          if-no-files-found: error
