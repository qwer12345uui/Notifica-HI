name: Build Notifica (Rootless and Roothide)

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify-and-build:
    name: ${{ matrix.display_name }}
    # Xcode on macOS emits the iOS 14+ arm64e ABI required by the iOS 15
    # Preferences process on A12-and-later hardware.
    runs-on: macos-14
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: rootless
            display_name: Build standard rootless package
            artifact_name: Notifica-rootless-iOS15-17
          - scheme: roothide
            display_name: Build Roothide hidden-root package
            artifact_name: Notifica-Roothide-iOS15-17
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: ${{ matrix.scheme }}
      FINALPACKAGE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run static compatibility checks
        run: python3 tests/verify_maintenance_release.py

      - name: Confirm Xcode arm64e toolchain
        shell: bash
        run: |
          set -euxo pipefail
          xcodebuild -version
          xcode-select -p
          xcrun --sdk iphoneos --find clang

      - name: Install RootHide Theos and pinned iPhoneOS SDK
        shell: bash
        run: |
          set -euxo pipefail
          brew install ldid xz dpkg
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "${THEOS}"
          mkdir -p "${THEOS}/sdks"
          curl -fsSL https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz \
            | tar -xJ -C "${THEOS}/sdks"
          test -f "${THEOS}/sdks/iPhoneOS16.5.sdk/System/Library/PrivateFrameworks/MediaRemote.framework/MediaRemote.tbd"

      - name: Confirm vendored RootHide SDK supplies Cephei and libcolorpicker
        shell: bash
        run: |
          set -euxo pipefail
          # The RootHide Theos submodules already ship ABI-matched frameworks and
          # .tbd stubs for the active scheme. Overwriting them with an unrelated
          # upstream Cephei SDK breaks the arm64e link, so assert instead.
          scheme_lib="${THEOS}/vendor/lib/iphone/${THEOS_PACKAGE_SCHEME}"
          test -d "${scheme_lib}/Cephei.framework"
          test -f "${scheme_lib}/libcolorpicker.tbd"
          test -f "${THEOS}/vendor/include/libcolorpicker.h"
          test -f "${THEOS}/vendor/include/roothide.h"
          test -f "${THEOS}/vendor/include/rootless.h"
          if [[ "${THEOS_PACKAGE_SCHEME}" == "roothide" ]]; then
            test -f "${scheme_lib}/libroothide.tbd"
          else
            test -f "${scheme_lib}/libroot.a"
          fi

      - name: Build selected package with Xcode arm64e ABI
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${THEOS}/sdks/iPhoneOS16.5.sdk"
          LOG="build-${{ matrix.scheme }}.log"
          {
            echo "=== scheme: ${{ matrix.scheme }} ==="
            echo "=== theos HEAD: $(git -C "${THEOS}" rev-parse --short HEAD 2>/dev/null || echo unknown) ==="
            echo "=== vendored libraries for scheme ==="
            ls -1 "${THEOS}/vendor/lib/iphone/${{ matrix.scheme }}" || true
            echo "=== make output ==="
          } > "${LOG}"
          # Capture the full make output so a failing build is diagnosable
          # without access to the authenticated Actions log viewer.
          THEOS="${THEOS}" TARGET=iphone:clang:16.5:15.0 SYSROOT="${SDK_ROOT}" ISYSROOT="${SDK_ROOT}" \
            make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=${{ matrix.scheme }} >> "${LOG}" 2>&1

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.scheme }}
          path: build-*.log
          if-no-files-found: ignore

      - name: Verify emitted DEB
        shell: bash
        run: |
          set -euo pipefail
          bash tests/verify_package_layout.sh packages 2>&1 | tee "verify-${{ matrix.scheme }}.log"

      - name: Reject old arm64e ABI toolchain output
        shell: bash
        run: |
          set -euxo pipefail
          ! grep -RinE 'incompatible arm64e ABI|error:' .theos packages

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-log-${{ matrix.scheme }}
          path: verify-*.log
          if-no-files-found: ignore

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: packages/*.deb
          if-no-files-found: error

  publish:
    name: Publish build output
    needs: verify-and-build
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect build output
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List collected files
        run: ls -R dist

      - name: Publish DEB packages
        if: needs.verify-and-build.result == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.10
          name: Notifica 1.0.10 (iOS 15 rootless + Roothide)
          body: |
            Automated build of Notifica 1.0.10 for iOS 15.0.

            - `Notifica-Roothide-iOS15-17.deb` — Roothide hidden-root scheme (`iphoneos-arm64e`)
            - `Notifica-rootless-iOS15-17.deb` — standard rootless scheme (`iphoneos-arm64`)
          files: dist/*.deb
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish build logs on failure
        if: needs.verify-and-build.result != 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-failure
          name: CI diagnostics (most recent failed build)
          body: |
            The build failed. The attached `build-<scheme>.log` files contain the
            complete `make` output for both package schemes.
          files: dist/*.log
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
